<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Worker Management | ServiceHub</title>

    <link rel="stylesheet" href="../CSS/output.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="icon" type="image/png" sizes="32x32" href="../Images/favicon-32x32.png?v=3">

    <link rel="icon" type="image/png" sizes="16x16" href="../Images/favicon-16x16.png?v=3">
</head>

<body class="min-h-screen bg-gray-950 text-white">

    <div class="min-h-screen">

        <div id="adminSidebar"></div>

        <main class="min-h-screen lg:ml-64">

            <div id="adminHeader"></div>

            <section class="px-4 py-8 sm:px-6 lg:px-8">

                <div class="max-w-7xl mx-auto">

                    <div class="mb-8">

                        <div class="flex items-center gap-2
                                    text-sm text-gray-500 mb-2">

                            <a href="AdminDashboard.html" class="hover:text-violet-400 transition-colors">

                                Dashboard

                            </a>

                            <i class="fa-solid fa-chevron-right text-xs"></i>

                            <span class="text-gray-400">
                                Worker Management
                            </span>

                        </div>

                        <h1 class="text-2xl font-bold sm:text-3xl">
                            Worker Management
                        </h1>

                        <p class="mt-2 text-gray-400">
                            Review and manage ServiceHub workers.
                        </p>

                    </div>


                    <div class="flex flex-wrap gap-2 mb-6">

                        <button class="worker-tab active px-4 py-2 rounded-lg
                                   text-sm font-medium
                                   bg-violet-600 text-white">

                            Pending

                        </button>

                        <button class="worker-tab px-4 py-2 rounded-lg
                                   text-sm font-medium
                                   text-gray-400 hover:text-white
                                   hover:bg-gray-800">

                            Verified

                        </button>

                        <button class="worker-tab px-4 py-2 rounded-lg
                                   text-sm font-medium
                                   text-gray-400 hover:text-white
                                   hover:bg-gray-800">

                            Rejected

                        </button>

                        <button class="worker-tab px-4 py-2 rounded-lg
                                   text-sm font-medium
                                   text-gray-400 hover:text-white
                                   hover:bg-gray-800">

                            Suspended

                        </button>

                    </div>


                    <div class="bg-gray-900 border border-gray-800
                                rounded-xl overflow-hidden">

                        <div class="px-6 py-5 border-b border-gray-800">

                            <div class="flex items-center justify-between">

                                <div>

                                    <h3 id="workerListTitle" class="text-lg font-semibold">

                                        Pending Workers

                                    </h3>

                                    <p id="workerListDescription" class="text-sm text-gray-500 mt-1">

                                        Workers waiting for verification.

                                    </p>

                                </div>

                                <span id="workerCount" class="px-3 py-1 rounded-full
                                             bg-gray-800 text-gray-400
                                             text-sm">

                                    0

                                </span>

                            </div>

                        </div>


                        <div class="overflow-x-auto">

                            <table class="w-full">

                                <thead>

                                    <tr class="text-left text-xs
                                               uppercase tracking-wider
                                               text-gray-500
                                               border-b border-gray-800">

                                        <th class="px-6 py-4">
                                            Worker
                                        </th>

                                        <th class="px-6 py-4">
                                            Contact
                                        </th>

                                        <th class="px-6 py-4">
                                            Experience
                                        </th>

                                        <th class="px-6 py-4">
                                            Status
                                        </th>

                                        <th class="px-6 py-4 text-right">
                                            Action
                                        </th>

                                    </tr>

                                </thead>

                                <tbody id="workerTableBody">

                                    <tr>

                                        <td colspan="5" class="px-6 py-16 text-center">

                                            <div class="flex flex-col
                                                        items-center">

                                                <div class="w-12 h-12
                                                            rounded-full
                                                            bg-gray-800
                                                            flex items-center
                                                            justify-center
                                                            mb-4">

                                                    <i class="fa-solid fa-users
                                                              text-gray-600
                                                              text-lg"></i>

                                                </div>

                                                <p class="text-gray-400">
                                                    Loading workers...
                                                </p>

                                            </div>

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </section>

            <div id="workerDetailsModal" class="fixed inset-0 z-50 hidden">

                <div id="workerDetailsOverlay" class="absolute inset-0 bg-black/70 backdrop-blur-sm">
                </div>

                <div class="relative flex min-h-screen items-center
                justify-center p-4">

                    <div class="flex w-full max-w-3xl max-h-[90vh]
                    flex-col overflow-hidden
                    rounded-2xl border border-white/10
                    bg-gray-900 shadow-2xl">

                        <div class="flex items-center justify-between
                        shrink-0
                        border-b border-gray-800 px-6 py-5">

                            <div>

                                <h2 class="text-xl font-semibold">
                                    Worker Details
                                </h2>

                                <p class="mt-1 text-sm text-gray-500">
                                    Complete worker information
                                </p>

                            </div>

                            <button id="closeWorkerDetails" class="flex h-9 w-9 items-center justify-center
                               rounded-lg text-gray-400
                               hover:bg-gray-800 hover:text-white
                               transition-colors">

                                <i class="fa-solid fa-xmark"></i>

                            </button>

                        </div>


                        <div id="workerDetailsContent" class="min-h-0 flex-1 overflow-y-auto p-6">

                            <div class="flex flex-col items-center
                            justify-center py-12">

                                <i class="fa-solid fa-user
                              text-3xl text-gray-600 mb-4"></i>

                                <p class="text-gray-400">
                                    Select a worker to view details.
                                </p>

                            </div>

                        </div>


                        <div id="workerDetailsActions" class="hidden shrink-0 border-t border-gray-800 px-6 py-5">

                            <div class="flex flex-wrap justify-end gap-3">

                                <button id="rejectWorkerButton" class="hidden px-4 py-2.5 rounded-lg
                                   bg-red-600/10 text-red-400
                                   border border-red-500/20
                                   hover:bg-red-600 hover:text-white
                                   transition-colors">

                                    <i class="fa-solid fa-xmark mr-2"></i>
                                    Reject

                                </button>


                                <button id="approveWorkerButton" class="hidden px-4 py-2.5 rounded-lg
                                   bg-green-600/10 text-green-400
                                   border border-green-500/20
                                   hover:bg-green-600 hover:text-white
                                   transition-colors">

                                    <i class="fa-solid fa-check mr-2"></i>
                                    Approve

                                </button>


                                <button id="suspendWorkerButton" class="hidden px-4 py-2.5 rounded-lg
                                   bg-yellow-600/10 text-yellow-400
                                   border border-yellow-500/20
                                   hover:bg-yellow-600 hover:text-white
                                   transition-colors">

                                    <i class="fa-solid fa-ban mr-2"></i>
                                    Suspend

                                </button>


                                <button id="restoreWorkerButton" class="hidden px-4 py-2.5 rounded-lg
                                   bg-violet-600/10 text-violet-400
                                   border border-violet-500/20
                                   hover:bg-violet-600 hover:text-white
                                   transition-colors">

                                    <i class="fa-solid fa-rotate-left mr-2"></i>
                                    Restore

                                </button>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <script src="components/AdminLayout.js"></script>
    <script src="WorkerManagement.js"></script>

</body>

</html>
