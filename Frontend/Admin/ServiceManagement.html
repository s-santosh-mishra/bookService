<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Service Management - ServiceHub</title>

    <link rel="stylesheet" href="../CSS/output.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../Images/favicon-32x32.png?v=3"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../Images/favicon-16x16.png?v=3"
    />
  </head>

  <body class="min-h-screen bg-gray-950 text-white">
    <div class="min-h-screen">
      <!-- Sidebar -->
      <div id="adminSidebar"></div>

      <!-- Main Content -->
      <main class="min-h-screen lg:ml-64">
        <!-- Header -->
        <div id="adminHeader"></div>

        <section class="px-4 py-8 sm:px-6 lg:px-8">
          <!-- Breadcrumb -->
          <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
            <a
              href="AdminDashboard.html"
              class="hover:text-white transition-colors"
            >
              Dashboard
            </a>

            <i class="fa-solid fa-chevron-right text-xs"></i>

            <a
              href="SystemManagement.html"
              class="hover:text-white transition-colors"
            >
              System Management
            </a>

            <i class="fa-solid fa-chevron-right text-xs"></i>

            <span class="text-gray-300"> Service Management </span>
          </div>

          <!-- Page Heading -->
          <div
            class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-8"
          >
            <div>
              <h1 class="text-2xl font-bold sm:text-3xl">Service Management</h1>

              <p class="text-gray-500 mt-2">
                Manage services and their categories.
              </p>
            </div>

            <button
              id="addServiceButton"
              class="inline-flex items-center justify-center gap-2 px-4 py-2.5 bg-violet-600 hover:bg-violet-500 rounded-lg font-medium transition-colors"
            >
              <i class="fa-solid fa-plus"></i>

              <span> Add Service </span>
            </button>
          </div>

          <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center">
            <label
              for="categoryFilter"
              class="text-sm font-medium text-gray-400"
            >
              Category
            </label>

            <select
              id="categoryFilter"
              class="w-full sm:w-64 px-4 py-2.5 bg-gray-900 border border-gray-800 rounded-lg text-white focus:outline-none focus:border-violet-500 transition-colors"
            >
              <option value="">All Categories</option>
            </select>
          </div>

          <!-- Service List -->
          <div
            class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden"
          >
            <!-- List Header -->
            <div
              class="px-6 py-4 border-b border-gray-800 flex items-center justify-between"
            >
              <div>
                <h2 class="font-semibold">Services</h2>

                <p class="text-sm text-gray-500 mt-1">
                  <span id="serviceCount">0</span>
                  services
                </p>
              </div>
            </div>

            <!-- Table -->
            <div class="overflow-x-auto">
              <table class="w-full">
                <thead class="bg-gray-800/50">
                  <tr>
                    <th
                      class="w-1/3 px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap"
                    >
                      Service
                    </th>

                    <th
                      class="w-1/4 px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap"
                    >
                      Category
                    </th>

                    <th
                      class="w-32 px-6 py-4 text-center text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap"
                    >
                      Workers
                    </th>

                    <th
                      class="w-32 px-6 py-4 text-left text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap"
                    >
                      Status
                    </th>

                    <th
                      class="w-28 px-6 py-4 text-right text-xs font-medium text-gray-500 uppercase tracking-wider whitespace-nowrap"
                    >
                      Action
                    </th>
                  </tr>
                </thead>

                <tbody id="serviceTableBody">
                  <tr>
                    <td
                      colspan="5"
                      class="px-6 py-12 text-center text-gray-500"
                    >
                      Loading services...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>
      </main>
    </div>

    <!-- Add Service Modal -->
    <div
      id="addServiceModal"
      class="hidden fixed inset-0 z-50 flex items-center justify-center p-4"
    >
      <div
        id="addServiceOverlay"
        class="absolute inset-0 bg-black/70 backdrop-blur-sm"
      ></div>

      <div
        class="relative w-full max-w-lg bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl"
      >
        <!-- Modal Header -->
        <div
          class="flex items-center justify-between px-6 py-5 border-b border-gray-800"
        >
          <div>
            <h2 class="text-lg font-semibold">Add Service</h2>

            <p class="text-sm text-gray-500 mt-1">
              Create a new service under a category.
            </p>
          </div>

          <button
            id="closeAddService"
            type="button"
            class="w-9 h-9 rounded-lg flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-800 transition-colors"
          >
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Form -->
        <form id="addServiceForm">
          <div class="px-6 py-6 space-y-5">
            <!-- Category -->
            <div>
              <label
                for="categoryId"
                class="block text-sm font-medium text-gray-300 mb-2"
              >
                Category
              </label>

              <select
                id="categoryId"
                name="categoryId"
                required
                class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg text-white focus:outline-none focus:border-violet-500 transition-colors"
              >
                <option value="">Select a category</option>
              </select>

              <p class="text-xs text-gray-600 mt-2">
                Only active categories can be selected.
              </p>
            </div>

            <!-- Service Name -->
            <div>
              <label
                for="serviceName"
                class="block text-sm font-medium text-gray-300 mb-2"
              >
                Service Name
              </label>

              <input
                type="text"
                id="serviceName"
                name="serviceName"
                maxlength="100"
                required
                placeholder="Enter service name"
                class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-violet-500 transition-colors"
              />
            </div>

            <!-- Price Per Hour -->
            <div>
              <label
                for="basePricePerHour"
                class="block text-sm font-medium text-gray-300 mb-2"
              >
                Price Per Hour
              </label>

              <input
                type="number"
                id="basePricePerHour"
                name="basePricePerHour"
                min="0.01"
                step="0.01"
                required
                placeholder="Enter hourly price"
                class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-violet-500 transition-colors"
              />
            </div>

            <!-- Minimum Service Fee -->
            <div>
              <label
                for="minimumServiceFee"
                class="block text-sm font-medium text-gray-300 mb-2"
              >
                Minimum Service Fee
              </label>

              <input
                type="number"
                id="minimumServiceFee"
                name="minimumServiceFee"
                min="0.01"
                step="0.01"
                required
                placeholder="Enter minimum service fee"
                class="w-full px-4 py-3 bg-gray-950 border border-gray-800 rounded-lg text-white placeholder-gray-600 focus:outline-none focus:border-violet-500 transition-colors"
              />
            </div>
          </div>

          <!-- Modal Footer -->
          <div
            class="flex items-center justify-end gap-3 px-6 py-4 border-t border-gray-800"
          >
            <button
              id="cancelAddService"
              type="button"
              class="px-4 py-2.5 bg-gray-800 hover:bg-gray-700 rounded-lg text-sm font-medium transition-colors"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="px-4 py-2.5 bg-violet-600 hover:bg-violet-500 rounded-lg text-sm font-medium transition-colors"
            >
              Add Service
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="components/AdminLayout.js"></script>
    <script src="ServiceManagement.js"></script>
  </body>
</html>
